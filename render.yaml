services:
  - type: web
    name: affora-api
    runtime: node
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false   # Set this in the Render dashboard → Environment
      - key: JWT_SECRET
        sync: false   # Set this in the Render dashboard → Environment
      - key: GOOGLE_CLIENT_ID
        sync: false   # Set this in the Render dashboard → Environment
